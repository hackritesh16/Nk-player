name: Android CI - NK PLAYER

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q NK_PLAYER.zip -d .

      - name: Fix Kotlin compilation issues in archived source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("NK_PLAYER/app/src/main/java/com/nk/player")

          main = root / "MainActivity.kt"
          text = main.read_text()
          import_line = "import androidx.activity.compose.setContent\n"
          launcher_import = "import androidx.activity.compose.rememberLauncherForActivityResult\n"
          if launcher_import not in text:
              if import_line not in text:
                  raise SystemExit("Could not find the Compose setContent import in MainActivity.kt")
              main.write_text(text.replace(import_line, import_line + launcher_import, 1))

          player_screen = root / "ui/screens/PlayerScreen.kt"
          text = player_screen.read_text()
          old = "AssistChip(onClick = { player?.repeatMode = if(player.repeatMode==Player.REPEAT_MODE_ONE) Player.REPEAT_MODE_OFF else Player.REPEAT_MODE_ONE }"
          new = "AssistChip(onClick = { player?.let { it.repeatMode = if(it.repeatMode==Player.REPEAT_MODE_ONE) Player.REPEAT_MODE_OFF else Player.REPEAT_MODE_ONE } }"
          if old in text:
              player_screen.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("Could not find the nullable repeat-mode expression in PlayerScreen.kt")

          prefs = root / "utils/Prefs.kt"
          text = prefs.read_text()
          if "app.dataStore" in text:
              text = text.replace("app.dataStore", "app.ds")
          if "import kotlinx.coroutines.flow.first\n" not in text:
              flow_import = "import kotlinx.coroutines.flow.Flow\n"
              if flow_import not in text:
                  raise SystemExit("Could not find the Flow import in Prefs.kt")
              text = text.replace(flow_import, flow_import + "import kotlinx.coroutines.flow.first\n", 1)
          old = 'suspend fun snapshotTheme(): String = theme.let{ var r="dark"; app.ds.data.map{it[THEME]?: "dark"}.collect{ r=it }; r }'
          new = 'suspend fun snapshotTheme(): String = app.ds.data.map { it[THEME] ?: "dark" }.first()'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Could not find snapshotTheme in Prefs.kt")
          prefs.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: NK_PLAYER

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace
        working-directory: NK_PLAYER

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NK-PLAYER-debug-apk
          path: NK_PLAYER/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NK-PLAYER-release-apk
          path: NK_PLAYER/app/build/outputs/apk/release/*.apk
